{% extends "base.html" %}
{% block title %}Confirm delete - Tally{% endblock %}

{% block content %}
<div class="auth-card">
  <h1>Delete this record?</h1>
  <p class="subtitle">You are about to delete <strong>{{ object }}</strong>. This cannot be undone.</p>

  <form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Yes, delete</button>
  </form>

  <p class="switch"><a href="{{ cancel_url }}">Cancel</a></p>
</div>
{% endblock %}
